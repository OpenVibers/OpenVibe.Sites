# openvibe.news — static front page (OpenVibe.Sites). Generated by build.js; edit sites.json, not this.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.news www.openvibe.news;
    return 301 https://openvibe.news$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.news;
    ssl_certificate     /etc/letsencrypt/live/openvibe.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.news/privkey.pem;
    return 301 https://openvibe.news$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.news;

    ssl_certificate     /etc/letsencrypt/live/openvibe.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.news/privkey.pem;

    root /opt/openvibe.sites/dist/openvibe.news;
    index index.html;

    access_log /var/log/nginx/openvibe.news.access.log;
    error_log  /var/log/nginx/openvibe.news.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; types { application/xml xml; } }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } add_header Cache-Control "public, max-age=86400"; }
    location = /status.json { add_header Cache-Control "public, max-age=600"; add_header Access-Control-Allow-Origin "*"; }

    # Only the files in dist/ exist; anything else is a real 404 with a page, never the front page.
    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
