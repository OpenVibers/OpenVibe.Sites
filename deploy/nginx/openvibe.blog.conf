# openvibe.blog — static front page (OpenVibe.Sites). Generated by build.js; edit sites.json, not this.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.blog www.openvibe.blog;
    return 301 https://openvibe.blog$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.blog;
    ssl_certificate     /etc/letsencrypt/live/openvibe.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.blog/privkey.pem;
    return 301 https://openvibe.blog$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.blog;

    ssl_certificate     /etc/letsencrypt/live/openvibe.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.blog/privkey.pem;

    root /opt/openvibe.sites/dist/openvibe.blog;
    index index.html;

    access_log /var/log/nginx/openvibe.blog.access.log;
    error_log  /var/log/nginx/openvibe.blog.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; types { application/xml xml; } }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } add_header Cache-Control "public, max-age=86400"; }

    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ /index.html;
    }

    location ~ /.(?!well-known) { deny all; }
}
